<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPACETIME — Workspace Shell</title>
<style>
  :root {
    --bg: #06070b; --panel: #0b0d14; --panel2: #0f1219; --line: #1c2130;
    --text: #d6dbe6; --dim: #6b7385; --dimmer: #464d5e;
    --cyan: #38bdf8; --purple: #a855f7; --orange: #f59e0b; --red: #ef4444;
    --green: #22c55e; --accent: #8b9dff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #12142a 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 0%, #1a1030 0%, transparent 55%), var(--bg);
    color: var(--text); font: 13px/1.45 var(--mono); overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
  button:hover { border-color: #2c3648; background: #131722; }
  button.primary { border-color: #2f4a6b; background: #10203a; color: #cfe4ff; }
  button.primary:hover { background: #143054; }
  button.rec { border-color: #5a2a2a; background: #24100f; color: #ffcfcf; }
  button.rec:hover { background: #361512; }
  .app { display: grid; grid-template-rows: 40px 1fr 194px 30px; height: 100vh; }

  /* ── top bar ───────────────────────────────────── */
  .top { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: rgba(8,10,16,.7); }
  .lights { display: flex; gap: 6px; }
  .lights i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .brand { letter-spacing: .22em; font-weight: 600; color: #eaf0ff; text-shadow: 0 0 18px rgba(139,157,255,.55); }
  .brand small { letter-spacing: .04em; color: var(--dim); font-weight: 400; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .ombre { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; background: #0a0c13; color: var(--dim); min-width: 120px; }
  .ombre b { color: var(--purple); font-weight: 600; }
  .ombre input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); }
  .meta { color: var(--dim); display: flex; gap: 12px; white-space: nowrap; }
  .meta b { color: var(--text); font-weight: 500; }

  /* ── body ──────────────────────────────────────── */
  .body { display: grid; grid-template-columns: 268px 1fr; min-height: 0; }
  .side { border-right: 1px solid var(--line); background: linear-gradient(180deg,#0a0c13, #080a10); overflow: auto; padding: 8px 6px; }
  .side h4 { margin: 10px 8px 6px; font-size: 10px; letter-spacing: .18em; color: var(--dimmer); font-weight: 600; }
  .tabrow { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .tabrow:hover { background: #0f131c; }
  .tabrow.on { background: #131a2a; border-color: #23304a; box-shadow: inset 2px 0 0 var(--focus-color, #8b9dff); }
  .tabrow .ic { font-size: 11px; }
  .tabrow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabrow.choked .nm { color: var(--dim); }
  .tabrow.dead { opacity: .45; text-decoration: line-through; }
  .badge { font-size: 9.5px; border-radius: 3px; padding: 1px 5px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .badge.frozen { color: #93c5fd; border-color: #1e3a5f; background: #0b1a2a; }
  .tree { white-space: pre; color: var(--dimmer); font-size: 11px; }
  .store { margin: 8px; padding: 8px; border: 1px dashed #223047; border-radius: 6px; color: var(--dim); font-size: 11.5px; }
  .store b { color: #7dd3a7; }
  .openbar { display: flex; gap: 5px; margin: 10px 8px 0; }
  .openbar button { flex: 1; font-size: 11px; }

  /* ── stage ─────────────────────────────────────── */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabhead { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #090b11; }
  .tabhead .title { font-size: 14px; color: #eef2ff; }
  .trustline { height: 2px; }
  .stats { margin-left: auto; display: flex; gap: 12px; color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 500; }
  .viewport { position: relative; flex: 1; overflow: hidden; min-height: 0;
    background:
      linear-gradient(to right, #0b0e15 1px, transparent 1px) 0 0/ 44px 44px,
      linear-gradient(to bottom, #0b0e15 1px, transparent 1px) 0 0/ 44px 44px,
      radial-gradient(700px 400px at 50% 30%, #101526 0%, #070910 70%);
  }
  .guest { position: absolute; inset: 0; padding: 18px 20px; }
  .guest .appbar { display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 11.5px; }
  .guest .appbar .logo { color: var(--accent); letter-spacing: .12em; }
  .guest .menu { display: flex; gap: 12px; }
  .guest .menu span { padding: 2px 0; color: var(--text); opacity: .8; }
  .guest .body { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; height: 100%; }
  .clips { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .clip { width: 132px; border: 1px solid #1d2536; border-radius: 6px; overflow: hidden; background: #0c1018; }
  .clip .thumb { height: 56px; background: repeating-linear-gradient(45deg,#101827,#101827 6px,#0d1420 6px,#0d1420 12px); }
  .clip .lbl { padding: 4px 6px; font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; }
  .clip.ai .thumb { box-shadow: inset 0 0 0 1px #3b2a5c; }
  .stagebtns { position: absolute; right: 26px; bottom: 74px; display: grid; gap: 6px; width: 150px; }
  .stagebtns button { text-align: left; font-size: 11.5px; }
  .stagebtns button.warn { border-color: #4a2b2b; color: #ffb9b9; }
  .browserbar { position: absolute; left: 18px; right: 18px; top: 56px; display: flex; gap: 6px; color: var(--dim); font-size: 11px; }
  .browserbar .url { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: #080b11; }

  /* terminal tab */
  .term { position: absolute; inset: 0; padding: 14px 16px; background: #05070a; font-size: 12px; line-height: 1.55; overflow: hidden; }
  .term .ln { white-space: pre; }
  .term .prompt { color: #7dd3a7; }
  .term .cmd { color: #dbe7ff; }
  .term .out { color: #8a93a8; }
  .term .warn { color: #fbbf24; }
  .cursor { display: inline-block; width: 7px; height: 13px; background: #9fb4ff; vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  /* malware tab */
  .mal { position: absolute; inset: 0; display: grid; place-items: center; }
  .mal .card { border: 1px solid #4a2222; background: #12080a; border-radius: 10px; padding: 22px 26px; text-align: center; box-shadow: 0 0 60px rgba(239,68,68,.12); }
  .mal h3 { margin: 0 0 6px; color: #ff9b9b; font-size: 14px; letter-spacing: .04em; }
  .mal p { margin: 0 0 14px; color: #a67878; font-size: 11.5px; }
  .mal button { border-color: #5a2a2a; background: #200f0f; color: #ffd0d0; padding: 6px 14px; }

  /* ghost cursor */
  .ghost { position: absolute; pointer-events: none; transition: transform .13s linear; z-index: 6; }
  .ghost svg { filter: drop-shadow(0 0 8px rgba(139,157,255,.9)); }
  .ghost .label { position: absolute; left: 16px; top: 16px; white-space: nowrap; font-size: 10.5px; color: #cfe0ff;
    background: rgba(10,14,24,.9); border: 1px solid #2b3a5a; border-radius: 999px; padding: 2px 9px; }

  /* steer pill */
  .steer { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(720px, 88%);
    display: flex; align-items: center; gap: 10px; border: 1px solid #24304a; border-radius: 999px; padding: 7px 14px;
    background: rgba(10,13,22,.92); backdrop-filter: blur(6px); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .beat { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .steer .txt { color: var(--text); font-size: 11.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .steer .gauge { font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  .steer input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); }
  .steer input::placeholder { color: var(--dimmer); }
  .flash { position: absolute; left: 50%; transform: translateX(-50%); bottom: 62px; font-size: 11px; color: #ffd479;
    background: #241c08; border: 1px solid #4a3a12; border-radius: 999px; padding: 3px 12px; opacity: 0; transition: opacity .2s; }
  .flash.on { opacity: 1; }

  /* drawers */
  .drawer { border-top: 1px solid var(--line); background: #080a10; display: grid; grid-template-rows: 32px 1fr; min-height: 0; }
  .dtabs { display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .dtab { padding: 6px 12px; font-size: 11.5px; color: var(--dim); border-bottom: 2px solid transparent; cursor: pointer; background: none; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; }
  .dtab:hover { color: var(--text); background: none; border-color: transparent; border-bottom-color: #2a3550; }
  .dtab.on { color: #eaf0ff; border-bottom-color: var(--accent); }
  .dpane { overflow: auto; padding: 8px 14px 12px; display: none; }
  .dpane.on { display: block; }
  .hline { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--dim); padding: 3px 0; border-bottom: 1px dashed #12161f; }
  .hline .t { color: var(--dimmer); width: 64px; flex: none; }
  .hline .ok { color: var(--green); } .hline .blk { color: var(--red); } .hline .sink { color: var(--orange); }
  .hline .ep { color: var(--text); } .hline .asn { color: var(--dim); margin-left: auto; }
  .secttl { font-size: 10px; letter-spacing: .16em; color: var(--dimmer); margin: 10px 0 6px; }
  .empty { color: var(--dimmer); font-size: 11.5px; padding: 8px 0; }

  /* scrubber */
  .scrub { position: relative; height: 46px; margin: 6px 2px 4px; }
  .track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: linear-gradient(90deg,#101a2c,#16233a); border: 1px solid #1d2740; }
  .pin { position: absolute; top: 1px; width: 2px; height: 16px; background: #3f4c68; }
  .pin.ai { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
  .pin.file { background: var(--cyan); }
  .pin.net { background: var(--orange); }
  .slider { position: absolute; top: 12px; width: 2px; height: 20px; background: #fff; box-shadow: 0 0 12px #fff; }
  .slider .lab { position: absolute; top: -18px; left: -18px; font-size: 10px; color: #dfe7ff; white-space: nowrap; }
  .scrubrow { display: flex; align-items: center; gap: 10px; }
  .scrubrow input[type=range] { flex: 1; accent-color: var(--accent); }
  .scrubmeta { font-size: 11px; color: var(--dim); white-space: nowrap; }

  /* dag */
  .dag { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
  .node { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .node .m { width: 16px; flex: none; }
  .node.done .t { color: var(--dim); text-decoration: line-through; }
  .node.active { border-left: 2px solid var(--purple); margin-left: -10px; padding-left: 8px; background: linear-gradient(90deg, rgba(168,85,247,.10), transparent); }
  .node .note { color: var(--dimmer); font-size: 10.5px; margin-left: 6px; }
  .kv { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); padding: 2px 0; }
  .kv b { color: var(--text); font-weight: 500; }
  .barbg { height: 6px; background: #121724; border-radius: 3px; overflow: hidden; border: 1px solid #1b2233; }
  .barfg { height: 100%; background: linear-gradient(90deg,#6d7cff,#a855f7); }
  .chat { border: 1px solid #1a2130; border-radius: 6px; background: #070910; padding: 8px 10px; font-size: 11px; color: var(--dim); max-height: 92px; overflow: auto; }
  .chat .you { color: #cbd5e1; }
  .chat .ai { color: #a5b4fc; }

  /* status bar */
  .status { display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); background: #070910; white-space: nowrap; overflow: hidden; }
  .status b { color: var(--text); font-weight: 500; }
  .status .sep { color: #232a3a; }
  .status .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .live { color: var(--green); }
  .danger { color: var(--red); }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="brand">SPACETIME <small>workspace shell</small></div>
    <div class="pill" id="brains"><span class="dot" style="background:var(--purple);box-shadow:0 0 10px var(--purple)"></span> Brain: <b id="brainname">—</b></div>
    <div class="ombre">
      <b>@ai</b>
      <input id="goal" spellcheck="false" placeholder="describe a mission — spawns a heartbeat orchestrator">
      <button class="primary" id="go">Run</button>
    </div>
    <div class="pill"><span class="dot" style="background:var(--cyan)"></span> zygote <b id="zyg">—</b></div>
    <button class="primary" id="branch">🌿 Branch</button>
    <button id="newtab">＋</button>
    <button class="rec" id="close">Close tab</button>
  </div>

  <div class="body">
    <div class="side">
      <h4>WORKSPACE TREE</h4>
      <div id="tabs"></div>
      <div class="openbar">
        <button data-open="terminal">+ Terminal</button>
        <button data-open="file">+ Malware</button>
      </div>
      <h4>GLOBAL STORE</h4>
      <div class="store" id="store">sha256 content-addressed<br><b>—</b></div>
      <h4>FOCUS POLICY</h4>
      <div class="store" id="policy">—</div>
    </div>

    <div class="stage">
      <div class="trustline" id="trustline"></div>
      <div class="tabhead">
        <span class="title" id="tabtitle">—</span>
        <div class="stats" id="tabstats"></div>
      </div>
      <div class="viewport" id="viewport"></div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <div class="drawer">
    <div class="dtabs">
      <button class="dtab on" data-pane="pane-travel">⏪ Time travel</button>
      <button class="dtab" data-pane="pane-net">🕵 Honey-Duct <span id="netcount" class="badge">0</span></button>
      <button class="dtab" data-pane="pane-dag">🧠 Goal DAG</button>
      <button class="dtab" data-pane="pane-log">▤ Event log</button>
      <div class="meta" style="margin-left:auto"><span>tick <b id="tickno">0</b></span><span><b id="clock">0.0s</b></span>
        <button id="pause">⏸ Pause</button>
        <button id="tick1">Step</button>
        <button id="tick10">×10</button>
      </div>
    </div>

    <div class="dpane on" id="pane-travel">
      <div class="scrubrow">
        <span class="scrubmeta" id="travelmeta">—</span>
        <div class="scrub" style="flex:1" id="scrub"></div>
        <button class="primary" id="rewindBtn">⏪ Rewind</button>
        <button id="branchHere">🌿 Branch here</button>
      </div>
      <div class="secttl">AUTOMATIC EVENT PINS</div>
      <div id="pins"></div>
    </div>

    <div class="dpane" id="pane-net">
      <div id="netfeed"></div>
    </div>

    <div class="dpane" id="pane-dag">
      <div class="dag">
        <div>
          <div class="secttl">GOAL TREE</div>
          <div id="dagtree"></div>
        </div>
        <div>
          <div class="secttl">OPERATOR STATE</div>
          <div id="agentkv"></div>
          <div class="secttl">SCRATCHPAD</div>
          <div class="chat" id="scratch"></div>
          <div class="secttl">HUMAN STEERING</div>
          <div class="chat" id="steerlog"></div>
        </div>
      </div>
    </div>

    <div class="dpane" id="pane-log"><div id="logfeed"></div></div>
  </div>

  <div class="status">
    <span>⬣ <b id="s_tabs">0</b> tabs</span><span class="sep">│</span>
    <span>boot <b id="s_boot">—</b></span><span class="sep">│</span>
    <span>RAM <b id="s_ram">—</b> <span id="s_saved"></span></span><span class="sep">│</span>
    <span>choked <b id="s_choked">0</b></span><span class="sep">│</span>
    <span>net <span class="ok" id="s_allow">0</span>/<span class="blk" id="s_block">0</span>/<span class="sink" id="s_sink">0</span></span>
    <div class="right">
      <span id="s_cur">—</span>
      <span class="live">● simulated VMM</span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { data: null, playing: true, pane: 'pane-travel', scrubAt: null };

function api(path) {
  return fetch(path, { cache: 'no-store' }).then(r => r.json());
}

/* ── renderers ─────────────────────────────────────── */
function renderTabs(d) {
  const rows = [];
  const focus = d.tabs.focus;
  for (const t of d.tabs.tabs) {
    const cls = ['tabrow', t.id === focus ? 'on' : '', t.state === 'choked' ? 'choked' : ''].join(' ');
    const icon = t.trust === 'disposable' ? '🔴' : t.trust === 'airgapped' ? '🔵' : t.trust === 'honey-duct' ? '🟠' : '🟣';
    const choke = t.state === 'choked' ? '<span class="badge frozen">❄ 5%</span>' : '';
    const branch = t.depth > 0 ? `<span class="tree">${'└─'.padStart(2 + t.depth * 2, ' ')}</span>` : '';
    rows.push(`<div class="${cls}" data-tab="${t.id}" style="--focus-color:${t.color}">
      ${branch}<span class="ic">${icon}</span>
      <span class="nm">${esc(t.name)}</span>${choke}
      <span class="badge">${t.boot_ms}ms</span></div>`);
  }
  $('tabs').innerHTML = rows.join('') || '<div class="empty">no tabs</div>';
}

function trustColor(t) {
  return t.trust === 'disposable' ? 'var(--red)' : t.trust === 'airgapped' ? 'var(--cyan)'
    : t.trust === 'honey-duct' ? 'var(--orange)' : 'var(--purple)';
}

function renderStage(d) {
  const tab = d.tabs.tabs.find(t => t.id === d.tabs.focus) || d.tabs.tabs[0];
  const vp = $('viewport');
  if (!tab) { vp.innerHTML = '<div class="empty" style="padding:24px">no tab focused</div>'; return; }
  $('trustline').style.background = trustColor(tab);
  $('trustline').style.boxShadow = `0 0 18px ${trustColor(tab)}`;
  $('tabtitle').textContent = tab.name;
  const stats = [
    `microVM <b>#${String(tab.id).padStart(2,'0')}</b>`,
    `boot <b>${tab.boot_ms}ms</b>`,
    `RAM <b>${tab.private_ram_mb}MB</b>+${tab.shared_ram_mb}sh`,
    `cpu <b>${(tab.resources ? tab.resources.cpu_permille ?? tab.cpu_permille : tab.cpu_permille)}‰</b>`,
    `pids <b>${tab.pids_max}</b>`,
    `net <b style="color:${tab.trust === 'airgapped' || tab.trust === 'disposable' ? 'var(--cyan)' : 'var(--purple)'}">${esc(tab.trust)}</b>`,
  ];
  $('tabstats').innerHTML = stats.join(' <span class="sep">·</span> ');

  let html = '';
  const kind = tab.kind;
  const cur = d.cursor;
  if (kind === 'terminal') {
    html = `<div class="term">
      <div class="ln"><span class="prompt">guest@spacetime:~$</span> <span class="cmd">ffmpeg -i /storage/X/clip_01.mp4 -ss 00:00:12 -t 00:00:18 out.mp4</span></div>
      <div class="ln out">ffmpeg version 7.1 · virtio-console attached</div>
      <div class="ln out">Stream #0:0: Video: h264 (High), yuv420p, 1920x1080, 30 fps</div>
      <div class="ln out">frame=  180 fps= 60 q=28.0 size=    2048kB time=00:00:18.00 bitrate= 932.1kbits/s</div>
      <div class="ln"><span class="warn">⚠ airgapped</span> — virtio-net not attached; egress physically impossible</div>
      <div class="ln out">guest ram 410MB · balloon reclaimed ${d.warden.reclaimed_mb}MB</div>
      <div class="ln"><span class="prompt">guest@spacetime:~$</span> <span class="cursor"></span></div>
    </div>`;
  } else if (kind === 'file') {
    html = `<div class="mal"><div class="card">
      <h3>⚠ DISPOSABLE HAZARD · RAM ONLY</h3>
      <p>tab #${tab.id} · airgapped · overlay in tmpfs<br>closing this tab zeroes every page it touched</p>
      <button>▶ Run untrusted binary</button>
    </div></div>`;
  } else {
    const clips = ['clip_01.mp4','clip_02.mp4','clip_03.mp4'];
    html = `<div class="guest">
      <div class="browserbar"><span>◀</span><span>▶</span><span class="url">https://opencut.app/editor/project-9f2</span><span>🔒 stealth</span></div>
      <div class="appbar" style="margin-top:24px"><span class="logo">OPENCUT</span>
        <div class="menu"><span>File</span><span>Edit</span><span>Clip</span><span>Export</span></div>
        <span style="margin-left:auto">project-9f2 · 9:16</span></div>
      <div class="clips">${clips.map((c,i)=>`<div class="clip ${i===2?'ai':''}"><div class="thumb"></div><div class="lbl"><span>${c}</span><span>${i===2?'AI':'—'}</span></div></div>`).join('')}</div>
      <div style="margin-top:10px;color:var(--dim);font-size:11px">timeline · 3 tracks · playhead 00:12.4</div>
      <div class="stagebtns">
        <button>Import</button><button>Split</button><button class="warn">Delete</button><button>Export MP4</button>
      </div>
    </div>`;
  }
  if (cur && cur.tab === tab.id) {
    const label = cur.label ? `<div class="label">🤖 ${esc(cur.label)}</div>` : '';
    html += `<div class="ghost" style="transform:translate(${cur.x}px,${cur.y}px)">
      <svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1 L1 15 L5 11 L8 18 L11 16.5 L8 10 L14 10 Z" fill="#cfe0ff" stroke="#8b9dff"/></svg>${label}</div>`;
  }
  if (tab.kind === 'web' || tab.kind === 'ai') {
    const agent = d.agent;
    const usage = agent.session.usage * 100;
    html += `<div class="steer">
      <span class="beat"></span>
      <span class="txt">♥ #${agent.tick} · ${esc(agent.phase)} · ${esc(activeNode(agent))}</span>
      <span class="gauge">ctx ${usage.toFixed(0)}% · reset ${Math.round(agent.session.since_flush_ms/1000)}s ago</span>
      <input id="steerbox" placeholder="Steer the AI without pausing — Enter to send">
    </div>`;
  }
  vp.innerHTML = html;
  const box = $('steerbox');
  if (box) box.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const text = box.value.trim(); if (!text) return;
    box.value = '';
    api('/api/steer?text=' + encodeURIComponent(text)).then(render);
    flash('⚡ Directive queued for next heartbeat');
  });
}

function activeNode(agent) {
  const find = (nodes) => {
    for (const n of nodes) {
      if (n.id === agent.dag.active) return n.title;
      const hit = find(n.children || []);
      if (hit) return hit;
    }
    return null;
  };
  return find(agent.dag.nodes) || (agent.dag.complete ? 'mission complete' : 'planning');
}

function renderTravel(d) {
  const t = d.travel;
  const start = t.start_ms, end = Math.max(t.end_ms, start + 1);
  $('travelmeta').innerHTML = `window <b>${Math.round((end-start)/1000)}s</b> · ${t.count} snapshots · ${t.cost_kb}kB diffs`;
  const pins = (t.pins || []).slice(-60);
  const scrub = $('scrub');
  scrub.innerHTML = `<div class="track"></div>` + pins.map(p => {
    const at = state.scrubAt ?? end;
    const left = ((p.at_ms - start) / (end - start)) * 100;
    const cls = p.marker.includes('AI') ? 'ai' : p.marker.includes('File') ? 'file' : 'net';
    return `<div class="pin ${cls}" style="left:${Math.max(0, Math.min(100, left))}%" title="${esc(p.marker || 'state')} @ ${(p.at_ms/1000).toFixed(1)}s"></div>`;
  }).join('') + (() => {
    const at = state.scrubAt ?? end;
    const left = Math.max(0, Math.min(100, ((at - start) / (end - start)) * 100));
    return `<div class="slider" style="left:${left}%"><span class="lab">${((at-end)/1000).toFixed(1)}s</span></div>`;
  })();
  $('pins').innerHTML = pins.slice(-14).reverse().map(p =>
    `<div class="hline"><span class="t">${(p.at_ms/1000).toFixed(1)}s</span><span class="ep">${esc(p.marker || 'state change')}</span><span class="asn">${p.kb}kB diff</span></div>`
  ).join('') || '<div class="empty">history builds as the guest dirties pages</div>';
}

function renderNet(d) {
  const net = d.net;
  $('netcount').textContent = net.blocked + net.sinkholed;
  const rows = (net.entries || []).slice().reverse().slice(0, 120).map(e => {
    const cls = e.kind === 'allow' ? 'ok' : e.kind === 'block' ? 'blk' : 'sink';
    const icon = e.kind === 'allow' ? '🟢 ALLOWED' : e.kind === 'block' ? '🛑 BLOCKED' : '🕳 TRAPPED';
    return `<div class="hline"><span class="t">${(e.at_ms/1000).toFixed(1)}s</span>
      <span class="${cls}" style="width:96px">${icon}</span>
      <span class="ep">tab ${e.tab} → ${esc(e.endpoint)}${e.hostname ? ' ('+esc(e.hostname)+')' : ''}</span>
      <span style="color:var(--dimmer)">${esc(e.process)}</span>
      <span class="asn">${esc(e.asn)}</span></div>`;
  });
  $('netfeed').innerHTML = rows.join('') || '<div class="empty">no traffic yet</div>';
}

function renderDag(d) {
  const a = d.agent;
  const rows = [];
  const walk = (nodes, depth) => {
    for (const n of nodes) {
      const mark = n.state === 'done' ? '✓' : n.state === 'active' ? '▸' : n.state === 'ready' ? '○' : n.state === 'abandoned' || n.state === 'failed' ? '✕' : '·';
      const cls = n.state === 'done' ? 'done' : n.id === a.dag.active ? 'active' : '';
      rows.push(`<div class="node ${cls}"><span class="m" style="color:${n.state==='done'?'var(--green)':n.state==='active'?'var(--purple)':'var(--dimmer)'}">${mark}</span>
        <span class="t" style="padding-left:${depth*14}px">${esc(n.title)}</span>${n.note ? `<span class="note">${esc(n.note)}</span>` : ''}</div>`);
      walk(n.children || [], depth + 1);
    }
  };
  walk(a.dag.nodes, 0);
  $('dagtree').innerHTML = `<div style="color:var(--dim);margin-bottom:8px">mission: <b style="color:var(--text)">${esc(a.dag.mission)}</b></div>` +
    rows.join('') + `<div style="margin-top:10px"><div class="barbg"><div class="barfg" style="width:${(a.dag.progress*100).toFixed(0)}%"></div></div></div>`;

  const s = a.session;
  $('agentkv').innerHTML = [
    ['phase', a.phase], ['heartbeats', a.tick], ['brain', a.brain],
    ['session', '#' + s.session], ['tokens', `${s.tokens_used}/${s.token_budget}`],
    ['context resets', s.flushes], ['screenshots', `${a.screenshots_session} this session / ${a.screenshots_total} total`],
    ['machine ticks', d.tick],
  ].map(([k,v]) => `<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`).join('');

  const facts = a.scratchpad.facts || {};
  const factLines = Object.entries(facts).map(([k,v]) => `<div>• <b>${esc(k)}</b>: ${esc(v)}</div>`).join('');
  const notes = (a.scratchpad.notes || []).slice(-4).map(n => `<div>· ${esc(n)}</div>`).join('');
  $('scratch').innerHTML = factLines + notes || '<span class="empty">empty</span>';

  $('steerlog').innerHTML = (a.steer.history || []).length
    ? a.steer.history.map(h => `<div class="you">[${(h.at_ms/1000).toFixed(1)}s] ${esc(h.text)} <span style="color:var(--dimmer)">(${h.priority})</span></div>`).join('')
    : '<span class="empty">type in the pill to steer without pausing</span>';
}

function renderLog(d) {
  $('logfeed').innerHTML = (d.log || []).map(l => {
    const color = l.level === 'alert' ? 'var(--red)' : l.level === 'warn' ? 'var(--orange)' : l.level === 'good' ? 'var(--green)' : l.level === 'debug' ? 'var(--dimmer)' : 'var(--dim)';
    return `<div class="hline"><span class="t">${(l.at_ms/1000).toFixed(1)}s</span><span style="color:${color};width:52px">${esc(l.level)}</span>
      <span style="color:#8b9dae;width:92px">${esc(l.channel)}</span><span class="ep">${esc(l.text)}</span></div>`;
  }).join('');
}

function renderStatus(d) {
  $('s_tabs').textContent = d.tabs.live;
  const boot = Math.min(...d.tabs.tabs.map(t => t.boot_ms).filter(Boolean), 999);
  $('s_boot').textContent = d.tabs.tabs.length ? boot + 'ms' : '—';
  $('s_ram').textContent = d.tabs.private_ram_mb + 'MB';
  $('s_saved').innerHTML = d.tabs.shared_ram_saved_mb ? `<span style="color:var(--green)">(+${d.tabs.shared_ram_saved_mb}MB shared)</span>` : '';
  $('s_choked').textContent = d.tabs.tabs.filter(t => t.state === 'choked').length;
  $('s_allow').textContent = d.net.allowed;
  $('s_block').textContent = d.net.blocked;
  $('s_sink').textContent = d.net.sinkholed;
  $('s_cur').textContent = d.cursor.label ? `🤖 ${d.cursor.label}`.slice(0, 44) : '';
  $('tickno').textContent = d.tick;
  $('clock').textContent = (d.now_ms / 1000).toFixed(1) + 's';
  $('zyg').textContent = d.zygote.state;
  $('brainname').textContent = d.agent.brain;
  $('store').innerHTML = `sha256 content-addressed<br><b>${d.tabs.live}</b> tabs share <b>${d.zygote.shared_ram_mb}MB</b> base · ${d.tabs.shared_ram_saved_mb}MB saved`;
  $('policy').innerHTML = `focus <b>750‰</b> · background <b>50‰</b><br>throttle events <b>${d.warden.throttle_events}</b>`;
}

function render(d) {
  state.data = d;
  renderTabs(d); renderStage(d); renderTravel(d); renderNet(d); renderDag(d); renderLog(d); renderStatus(d);
}

function flash(msg) {
  const el = $('flash'); el.textContent = msg; el.classList.add('on');
  clearTimeout(flash.t); flash.t = setTimeout(() => el.classList.remove('on'), 1400);
}

/* ── wiring ────────────────────────────────────────── */
$('tabs').addEventListener('click', e => {
  const row = e.target.closest('[data-tab]'); if (!row) return;
  api('/api/focus?tab=' + row.dataset.tab).then(render);
});
$('branch').onclick = () => api('/api/branch').then(d => { flash('🌿 tab branched: ' + ((d.state && d.state.tabs.live) || '')); render(d.state || d); });
$('newtab').onclick = () => api('/api/open?name=scratch&kind=terminal').then(render);
$('close').onclick = () => { if (state.data) api('/api/close?tab=' + state.data.tabs.focus).then(render); };
$('pause').onclick = () => {
  state.playing = !state.playing;
  $('pause').textContent = state.playing ? '⏸ Pause' : '▶ Play';
  api('/api/play?on=' + (state.playing ? 1 : 0));
};
$('tick1').onclick = () => api('/api/tick?n=1').then(render);
$('tick10').onclick = () => api('/api/tick?n=10').then(render);
$('rewindBtn').onclick = () => {
  if (!state.data) return;
  const end = state.data.travel.end_ms;
  const at = state.scrubAt ?? Math.max(state.data.travel.start_ms, end - 10000);
  api('/api/rewind?at=' + Math.round(at)).then(d => { flash('⏪ rewound; RAM + registers restored'); render(d); });
};
$('branchHere').onclick = () => api('/api/branch').then(d => { flash('🌿 branched from the past'); render(d.state || d); });
$('go').onclick = () => {
  const goal = $('goal').value.trim(); if (!goal) return;
  api('/api/steer?text=' + encodeURIComponent(goal)).then(d => { flash('♥ mission queued for the heartbeat'); render(d); });
};
$('goal').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
document.querySelectorAll('[data-open]').forEach(b => b.onclick = () =>
  api('/api/open?name=' + b.dataset.open + '&kind=' + b.dataset.open).then(render));
document.querySelectorAll('.dtab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.dtab').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.dpane').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); $(b.dataset.pane).classList.add('on');
});
$('scrub').addEventListener('click', e => {
  if (!state.data) return;
  const rect = $('scrub').getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const t = state.data.travel;
  state.scrubAt = t.start_ms + ratio * (t.end_ms - t.start_ms);
  renderTravel(state.data);
});

function poll() {
  api('/api/state').then(render).catch(() => {});
  setTimeout(poll, 420);
}
poll();
</script>
</body>
</html>
