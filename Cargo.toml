[workspace]
resolver = "2"
members = [
    "crates/spacetime-core",
    "crates/spacetime-vmm",
    "crates/spacetime-net",
    "crates/spacetime-warden",
    "crates/spacetime-agent",
    "crates/spacetime-shell",
    "crates/guest-init",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["c4us4l1ty"]
repository = "https://github.com/c4us4l1ty/spacetime"
publish = false

[workspace.dependencies]
spacetime-core = { path = "crates/spacetime-core" }
spacetime-vmm = { path = "crates/spacetime-vmm" }
spacetime-net = { path = "crates/spacetime-net" }
spacetime-warden = { path = "crates/spacetime-warden" }
spacetime-agent = { path = "crates/spacetime-agent" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
