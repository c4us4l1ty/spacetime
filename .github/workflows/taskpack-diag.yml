# Temporary helper: replay the CI steps and commit the transcript to the branch.
#
# The development sandbox for this branch has no Rust toolchain, and the Actions log endpoints are
# not reachable from it, so the only way to read a failure is to write it into the repository.
# This workflow is deleted once the branch is green.
name: taskpack diagnostic (temporary)

on:
  push:
    branches: ["arena/cc36730c-spacetime"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: |
          {
            echo "=== cargo clippy ==="
            cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1
            echo "clippy exit: $?"
          } > .ci-report.txt 2>&1 || true
      - name: Tests
        run: |
          {
            echo "=== cargo test --workspace ==="
            cargo test --workspace --all-targets --locked 2>&1
            echo "workspace tests exit: $?"
          } >> .ci-report.txt 2>&1 || true
      - name: Task pack step
        run: |
          {
            echo "=== task pack step ==="
            bash -n bench/taskpack/assemble.sh
            echo "assemble syntax: $?"
            bash -n bench/taskpack/run.sh
            echo "run syntax: $?"
            bash bench/taskpack/run.sh matrix 2>&1
            echo "matrix exit: $?"
            cargo run -q -p spacetime-ctl -- bench taskpack --out target/taskpack.json 2>&1
            echo "ctl exit: $?"
            cat target/taskpack.json
          } >> .ci-report.txt 2>&1 || true
      - name: End-to-end verification
        run: |
          {
            echo "=== end-to-end verification ==="
            cargo run -q -p spacetime-ctl -- verify 2>&1
            echo "verify exit: $?"
          } >> .ci-report.txt 2>&1 || true
      - name: Commit the transcript
        run: |
          git config user.name "spacetime-diagnostic"
          git config user.email "spacetime-diagnostic@users.noreply.github.com"
          git add -f .ci-report.txt
          git commit -m "Task-pack diagnostic transcript"
          git push origin HEAD:arena/cc36730c-spacetime
