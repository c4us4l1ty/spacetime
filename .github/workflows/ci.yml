name: Spacetime CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compile and verify Blocks 1-3 offline prototype
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Native window startup smoke
        run: |
          target/release/spacetime-gui --worker help | grep -q 'space boot'
          ! target/release/spacetime-gui --worker space boot --experimental
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libxkbcommon-x11-0
          set +e
          timeout 10 xvfb-run -a target/release/spacetime-gui > target/native-window.log 2>&1
          status=$?
          set -e
          cat target/native-window.log
          if [ "$status" -ne 124 ]; then
            echo "::error::Native window exited with status $status (expected timeout)"
            sed -n '1,30s/^/::error::/p' target/native-window.log
            exit 1
          fi

      - name: Rust workspace interface smoke
        run: |
          printf '2\n' | target/release/spacetime-ctl workspace > target/workspace-ui.txt
          grep -q 'experimental offline workspace' target/workspace-ui.txt
          ! target/release/spacetime-ctl space run --kernel missing --busybox missing

      - name: CLI smoke - happy path
        run: |
          cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_hello.task --cortex scripted --ledger target/block1.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/block1.jsonl
          cargo run --release --locked -p spacetime-ctl -- replay target/block1.jsonl > target/replay.json
          cmp target/block1.jsonl.state target/replay.json

      - name: CLI smoke - false claim
        run: |
          ! cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_false_claim.task --cortex scripted --ledger target/false.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/false.jsonl
          grep -q '"goal_status":"unverified"' target/false.jsonl.state

      - name: CLI smoke - timeout
        run: |
          ! cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_timeout.task --cortex scripted --ledger target/timeout.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/timeout.jsonl
          grep -q '"goal_status":"failed"' target/timeout.jsonl.state

      - name: Crucible smoke - determinism and metrology
        run: |
          cargo run --release --locked -p spacetime-ctl -- crucible verify --task bench/tasks/block1_hello.task > target/crucible-verify.txt
          grep -q 'verdict=pass' target/crucible-verify.txt
          cargo run --release --locked -p spacetime-ctl -- crucible false-pass --task bench/tasks/block1_hello.task --runs 50 > target/crucible-false-pass.txt
          grep -q 'false_pass_rate=0.0000' target/crucible-false-pass.txt
          cargo run --release --locked -p spacetime-ctl -- crucible differential --limit 1000000 > target/crucible-differential.txt
          grep -q 'differential_matches=1000000' target/crucible-differential.txt
          grep -q 'mutation_score_bps=10000' target/crucible-differential.txt
          cargo run --release --locked -p spacetime-ctl -- crucible sources > target/crucible-sources.txt
          grep -q 'priority=1 source=FixtureSuite' target/crucible-sources.txt
          grep -q 'priority=5 source=Mutation' target/crucible-sources.txt
          for task in bench/tasks/block2_flaky*.task; do
            ! cargo run --release --locked -p spacetime-ctl -- crucible verify --task "$task"
          done
          cargo run --release --locked -p spacetime-ctl -- crucible panel --task bench/tasks/block1_hello.task > target/crucible-panel.txt
          grep -q 'panel_verdict=pass' target/crucible-panel.txt
          grep -q 'sources=5' target/crucible-panel.txt
          grep -q 'conflicts=0' target/crucible-panel.txt
          cargo run --release --locked -p spacetime-ctl -- crucible adversarial --dir bench/adversarial > target/crucible-adversarial.txt
          grep -q 'adversarial_fixtures=20' target/crucible-adversarial.txt
          grep -q 'mismatches=0' target/crucible-adversarial.txt
          cargo run --release --locked -p spacetime-ctl -- crucible population --operators 10 --runs 50 > target/crucible-population.txt
          grep -q 'runs_per_operator=50' target/crucible-population.txt
          grep -q 'promoted_false_pass_leaks=0' target/crucible-population.txt
          grep -q 'real_operator_study=false' target/crucible-population.txt
          cargo run --release --locked -p spacetime-ctl -- crucible fixture-population --runs 50 > target/crucible-fixture-population.txt
          grep -q 'fixtures=26' target/crucible-fixture-population.txt
          grep -q 'verifier_runs=1300' target/crucible-fixture-population.txt
          grep -q 'max_flip_rate=0.0000' target/crucible-fixture-population.txt
          grep -q 'max_leak_rate=0.0000' target/crucible-fixture-population.txt
          grep -q 'mismatches=0' target/crucible-fixture-population.txt
          grep -q 'real_fixture_population=true' target/crucible-fixture-population.txt
          grep -q 'real_operator_study=false' target/crucible-fixture-population.txt
          ! cargo run --release --locked -p spacetime-ctl -- crucible false-pass --task bench/tasks/block1_hello.task --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible differential --limit 1
          ! cargo run --release --locked -p spacetime-ctl -- crucible population --operators 10 --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible fixture-population --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible adversarial --dir
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --measurement
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --measurement
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --measurement --out target/verify.toml
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --unknown value
          ! cargo run --release --locked -p spacetime-ctl -- verify --measurement target/ci-host.measurement
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --out target/verify.toml
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --measurement a --measurement b
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --measurement a --measurement b
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --bogus x
          ! cargo run --release --locked -p spacetime-ctl -- machine --bogus
          ! cargo run --release --locked -p spacetime-ctl -- crucible adversarial --dir bench/adversarial --dir bench/adversarial
          ! cargo run --release --locked -p spacetime-ctl -- crucible adversarial --bogus x

      - name: End-to-end verification
        run: |
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml > target/verify.stdout
          cat target/verify.toml
          grep -q '^status = "pass"$' target/verify.toml
          grep -q '^failed = 0$' target/verify.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify.toml
          grep -q 'name = "mock_economy_invariants"' target/verify.toml
          grep -q 'atomic=true overdraft_rejected=true idempotent=true hash_chain=verified' target/verify.toml
          grep -q 'name = "block1_happy"' target/verify.toml
          grep -q 'name = "crucible_flaky_family"' target/verify.toml
          grep -q '^gates = 29$' target/verify.toml
          grep -q 'name = "determinism_controls"' target/verify.toml
          grep -q 'name = "capability_enforcement"' target/verify.toml
          grep -q 'name = "cli_input_validation"' target/verify.toml
          grep -q 'name = "verifier_panel"' target/verify.toml
          grep -q 'name = "adversarial_corpus"' target/verify.toml
          grep -q 'name = "operator_population"' target/verify.toml
          grep -q 'name = "fixture_population"' target/verify.toml
          grep -q 'name = "resource_gate_unmeasured"' target/verify.toml
          grep -q 'name = "target_profile_registry"' target/verify.toml
          grep -q 'name = "econbench_offline"' target/verify.toml
          grep -q 'name = "static_console_report"' target/verify.toml
          grep -q '^econbench_fixtures = 20$' target/verify.toml
          grep -q '^static_console = "offline_prototype"$' target/verify.toml
          grep -q '^block3_done = false$' target/verify.toml
          grep -q '^target_profile = "4gb_potato"$' target/verify.toml
          grep -q '^baseline_target_profile = "4gb_potato"$' target/verify.toml
          grep -q '^target_profile_registry = 3$' target/verify.toml
          grep -q '^evaluated_memory_budget_kb = 4194304$' target/verify.toml
          grep -q '^profile_role = "baseline_gate"$' target/verify.toml
          grep -q '^panel_sources = 5$' target/verify.toml
          grep -q '^adversarial_fixtures = 20$' target/verify.toml
          grep -q '^determinism_shim = "ld_preload_not_complete_boundary"$' target/verify.toml
          grep -q '^capability_allow_list = "local_fixture_only"$' target/verify.toml
          grep -q '^fixture_population_fixtures = 26$' target/verify.toml
          grep -q '^fixture_population_runs = 50$' target/verify.toml
          grep -q '^fixture_population_verifier_runs = 1300$' target/verify.toml
          grep -q '^synthetic_operator_population = true$' target/verify.toml
          grep -q '^real_operator_study = "unmeasured"$' target/verify.toml
          grep -q '^resource_gate_evaluator = "unmeasured_fail_pass_self_test"$' target/verify.toml
          grep -q '^cli_input_validation = "bounded"$' target/verify.toml
          grep -q '^resource_gate_host_validation = true$' target/verify.toml
          grep -q 'name = "measurement_intake"' target/verify.toml
          grep -q '^measurement_intake = "none"$' target/verify.toml
          grep -q '^measurement_evaluator = "none"$' target/verify.toml
          grep -q '^measurement_digest = "none"$' target/verify.toml
          grep -q 'no measurement file supplied' target/verify.toml

      - name: Measurement intake smoke
        run: |
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=github_actions\npeak_rss_kb=3000000\nboot_ms=900\ntab_switch_ms=900\ncpu_percent=80\n' > target/ci-host.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-ci-host.toml --measurement target/ci-host.measurement > target/verify-ci-host.stdout
          cat target/verify-ci-host.toml
          grep -q '^status = "pass"$' target/verify-ci-host.toml
          grep -q '^gates = 29$' target/verify-ci-host.toml
          grep -q '^measurement_intake = "evaluated"$' target/verify-ci-host.toml
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-ci-host.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify-ci-host.toml
          grep -q '^performance_claims = "unmeasured"$' target/verify-ci-host.toml
          grep -q 'non-target host' target/verify-ci-host.toml
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=potato-target-lab\npeak_rss_kb=oops\n' > target/invalid.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-invalid.toml --measurement target/invalid.measurement > target/verify-invalid.stdout
          grep -q '^status = "pass"$' target/verify-invalid.toml
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-invalid.toml
          grep -q 'bounded unsigned integer' target/verify-invalid.toml
          head -c 70000 /dev/zero > target/oversize.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-oversize.toml --measurement target/oversize.measurement > target/verify-oversize.stdout
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-oversize.toml
          grep -q '^measurement_digest = "unavailable"$' target/verify-oversize.toml
          grep -q '64 KiB bound' target/verify-oversize.toml
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=potato-target-lab\npeak_rss_kb=3000000\nboot_ms=900\ntab_switch_ms=900\ncpu_percent=80\n' > target/shape-only.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-shape.toml --measurement target/shape-only.measurement > target/verify-shape.stdout
          grep -q '^measurement_evaluator = "pass_shape_only"$' target/verify-shape.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify-shape.toml
          grep -q '^performance_claims = "unmeasured"$' target/verify-shape.toml
          grep -q 'physical provenance out of band' target/verify-shape.toml
          cargo run --release --locked -p spacetime-ctl -- machine gate --measurement target/shape-only.measurement > target/machine-shape.txt
          cat target/machine-shape.txt
          grep -q 'resource_gate=unmeasured' target/machine-shape.txt
          grep -q 'evaluator=pass_shape_only' target/machine-shape.txt
          ! grep -q 'resource_gate=pass' target/machine-shape.txt
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=potato-target-lab\npeak_rss_kb=99999999\nboot_ms=900\ntab_switch_ms=900\n' > target/over-budget.measurement
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --measurement target/over-budget.measurement
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=github_actions\nmeasurement_host=potato-target-lab\npeak_rss_kb=3000000\nboot_ms=900\ntab_switch_ms=900\n' > target/duplicate-host.measurement
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --measurement target/duplicate-host.measurement
          printf 'schema_version=1\ntarget_profile=8gb_reference\nmeasurement_host=public-target-lab\npeak_rss_kb=6000000\nboot_ms=900\ntab_switch_ms=900\ncpu_percent=80\n' > target/public-profile.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-public.toml --measurement target/public-profile.measurement > target/verify-public.stdout
          grep -q '^gates = 29$' target/verify-public.toml
          grep -q '^target_profile = "8gb_reference"$' target/verify-public.toml
          grep -q '^baseline_target_profile = "4gb_potato"$' target/verify-public.toml
          grep -q '^target_profile_registry = 3$' target/verify-public.toml
          grep -q '^evaluated_memory_budget_kb = 8388608$' target/verify-public.toml
          grep -q '^profile_role = "optional_profile"$' target/verify-public.toml
          grep -q '^measurement_evaluator = "pass_shape_only"$' target/verify-public.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify-public.toml
          cargo run --release --locked -p spacetime-ctl -- machine gate --measurement target/public-profile.measurement > target/machine-public.txt
          cat target/machine-public.txt
          grep -q 'resource_gate=unmeasured' target/machine-public.txt
          grep -q 'release_gate=unmeasured' target/machine-public.txt
          grep -q 'target_profile=8gb_reference' target/machine-public.txt
          grep -q 'baseline_target_profile=4gb_potato' target/machine-public.txt
          grep -q 'evaluator=pass_shape_only' target/machine-public.txt
          ! grep -q 'resource_gate=pass' target/machine-public.txt
          bash -n bench/measurements/capture-host-facts.sh
          ! bash bench/measurements/capture-host-facts.sh
          ! bash bench/measurements/capture-host-facts.sh --measurement target/forbidden.measurement
          ! bash bench/measurements/capture-host-facts.sh --profile unregistered-profile
          ! bash bench/measurements/capture-host-facts.sh --profile 4gb_potato --profile 8gb_reference
          bash bench/measurements/capture-host-facts.sh --list-profiles > target/target-profiles.txt
          cat target/target-profiles.txt
          grep -q '^4gb_potato' target/target-profiles.txt
          grep -q '^8gb_reference' target/target-profiles.txt
          grep -q '^16gb_developer' target/target-profiles.txt
          test -f bench/targets/profiles.tsv
          test -f bench/measurements/PROVENANCE-TEMPLATE.md
          grep -q 'out of band' bench/measurements/PROVENANCE-TEMPLATE.md

      - name: Block 3 offline console and EconBench
        run: |
          cargo run --release --locked -p spacetime-ctl -- ledger verify bench/econbench/sample-ledger.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify bench/economy/mock_wallet.jsonl
          cargo run --release --locked -p spacetime-ctl -- bench run --arm A --model scripted-fixture --budget 1000 --out target/econbench-A.json > target/econbench-A.stdout
          cat target/econbench-A.stdout
          python3 - <<'PY'
          import json
          report = json.load(open('target/econbench-A.json'))
          assert report['fixtures'] == 20
          assert report['completed'] == 20
          assert report['claims_surviving_reverification'] == 20
          assert report['false_pass_rate'] == 0.0
          assert report['network'] == 'none'
          assert report['model_adapter'] == 'offline_scripted'
          assert report['arm_efficacy_claim'] is False
          assert report['resource_gate'] == 'unmeasured_target_4gb'
          assert report['performance_claims'] == 'unmeasured'
          assert report['block3_done'] is False
          PY
          ! cargo run --release --locked -p spacetime-ctl -- bench run --arm D --model scripted-fixture --budget 1000 --out target/econbench-bad.json
          ! cargo run --release --locked -p spacetime-ctl -- bench run --arm A --model scripted-fixture --budget 0 --out target/econbench-bad.json
          ! cargo run --release --locked -p spacetime-ctl -- bench run --arm A --model scripted-fixture --budget 1000 --out target/econbench-A.json --out target/econbench-bad.json
          cargo run --release --locked -p spacetime-ctl -- console --ledger bench/econbench/sample-ledger.jsonl --out target/console-report.json > target/console-report.stdout
          cat target/console-report.stdout
          python3 - <<'PY'
          import json
          exported = json.load(open('target/console-report.json'))
          checked_in = json.load(open('apps/spacetime-console/report.json'))
          assert exported['resource_gate'] == 'unmeasured_target_4gb'
          assert exported['performance_claims'] == 'unmeasured'
          assert exported['execution']['net'] == 'none'
          assert exported['ledger']['event_count'] == 4
          assert len(exported['snapshot_strip']) == 3
          assert len(exported['workspaces']) == 2
          assert exported['ledger']['last_hash'] == checked_in['ledger']['last_hash']
          assert checked_in['mock_economy']['real_money'] is False
          PY
          ! cargo run --release --locked -p spacetime-ctl -- console --out target/console-bad.json --ledger
          ! cargo run --release --locked -p spacetime-ctl -- console --ledger bench/econbench/sample-ledger.jsonl --out target/console-report.json --bogus x
          python3 -m json.tool apps/spacetime-console/report.json > /dev/null
          grep -q 'Content-Security-Policy' apps/spacetime-console/index.html
          grep -q 'fetch("./report.json")' apps/spacetime-console/console.js
          grep -q '"preview_mode": "snapshot_on_action"' apps/spacetime-console/report.json
          test -f apps/spacetime-console/styles.css
          ! grep -RInE 'https?://|Electron|WebView|innerHTML|eval\(' apps/spacetime-console

      - name: Exploratory CLI profiler tests
        run: |
          python3 -m py_compile bench/measurements/profile_cli.py bench/measurements/test_profile_cli.py
          python3 -m unittest discover -s bench/measurements -p 'test_*.py' -v

      - name: Machine baseline
        run: |
          cargo run --release --locked -p spacetime-ctl -- machine > target/machine-baseline.toml
          cat target/machine-baseline.toml
          grep -q '^host_profile = "unspecified"$' target/machine-baseline.toml
          grep -q '^release_baseline_profile = "4gb_potato"$' target/machine-baseline.toml
          grep -q '^target_profile_registry = "bench/targets/profiles.tsv"$' target/machine-baseline.toml
          grep -q '^profile_count = 3$' target/machine-baseline.toml
          cargo run --release --locked -p spacetime-ctl -- machine profiles > target/machine-profiles.txt
          cat target/machine-profiles.txt
          grep -q 'id=4gb_potato' target/machine-profiles.txt
          grep -q 'id=8gb_reference' target/machine-profiles.txt
          grep -q 'id=16gb_developer' target/machine-profiles.txt
          grep -q 'baseline_gate=4gb_potato measured=false' target/machine-profiles.txt
          ! cargo run --release --locked -p spacetime-ctl -- machine profiles --bogus
          cargo run --release --locked -p spacetime-ctl -- machine gate > target/machine-gate.txt
          grep -q 'resource_gate=unmeasured' target/machine-gate.txt
          grep -q 'release_gate=unmeasured' target/machine-gate.txt
          grep -q 'evaluator=unmeasured' target/machine-gate.txt
          grep -q 'target_profile=4gb_potato' target/machine-gate.txt
          grep -q 'baseline_target_profile=4gb_potato' target/machine-gate.txt
          cat target/machine-gate.txt

  gui-msrv:
    name: Native UI Rust 1.88 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check minimum supported Rust
        run: |
          if ! cargo check --locked -p spacetime-gui > gui-msrv.log 2>&1; then
            tail -40 gui-msrv.log | sed 's/^/::error::/'
            exit 1
          fi

  vm-boot-spike:
    name: Experimental guest boot (software emulation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install guest test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 busybox-static linux-image-virtual bubblewrap
      - name: Build the disposable guest image
        run: |
          cargo build --release --locked -p spacetime-ctl
          printf 'fn main() { println!("SPACETIME_APP_OK"); }\n' > target/guest-app.rs
          printf 'SPACETIME_INPUT_OK\n' > target/guest-input.txt
          rustc -C target-feature=+crt-static target/guest-app.rs -o target/guest-app
          target/release/spacetime-ctl space initramfs --busybox /bin/busybox --app target/guest-app --input target/guest-input.txt --out target/guest.cpio
          ! target/release/spacetime-ctl space initramfs --busybox /bin/busybox --out target/guest.cpio
      - name: Boot and exercise the guest shell using TCG
        run: |
          set -o pipefail
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' -type f | sort -V | tail -1)
          test -n "$kernel"
          sudo chmod a+r "$kernel"
          # CI has no KVM. This tests the guest and QEMU device setup using software emulation,
          # not the KVM launch path, security boundary, or target-machine performance.
          { sleep 25; printf 'app\ncat /workspace/input\ntouch /tmp/check; test -f /tmp/check && echo SPACETIME_$(echo SHELL_OK)\nif [ -z "$(ls /sys/class/net | grep -v "^lo$")" ]; then echo SPACETIME_$(echo OFFLINE_OK); fi\nexit\n'; } |
            timeout 100 qemu-system-x86_64 -no-user-config -nodefaults -machine microvm,accel=tcg -cpu max -m 512 -smp 1 -display none -monitor none -serial stdio -nic none -no-reboot -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny -kernel "$kernel" -initrd target/guest.cpio -append 'console=ttyS0 panic=-1' > target/guest-boot.log 2>&1
          cat target/guest-boot.log
          tr -d '\r' < target/guest-boot.log | grep -x 'SPACETIME_APP_OK'
          tr -d '\r' < target/guest-boot.log | grep -x 'SPACETIME_INPUT_OK'
          tr -d '\r' < target/guest-boot.log | grep -x 'SPACETIME_SHELL_OK'
          tr -d '\r' < target/guest-boot.log | grep -x 'SPACETIME_OFFLINE_OK'

      - name: Boot guest inside monitor sandbox (software emulation)
        run: |
          # Some Ubuntu runner images restrict unprivileged user namespaces through AppArmor.
          # The test itself remains mandatory and fails if the sandbox cannot be created.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' -type f | sort -V | tail -1)
          test -n "$kernel"
          sudo chmod a+r "$kernel"
          export SPACETIME_GUEST_KERNEL="$kernel"
          export SPACETIME_GUEST_INITRAMFS="$PWD/target/guest.cpio"
          timeout 120 cargo test --locked -p spacetime-ctl sandboxed_guest_boots_without_network -- --ignored --nocapture
      - name: Check KVM launch when the runner exposes KVM
        run: |
          set -o pipefail
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' -type f | sort -V | tail -1)
            test -n "$kernel"
            { sleep 25; printf 'app\nexit\n'; } |
              timeout 90 target/release/spacetime-ctl space run --experimental --kernel "$kernel" --busybox /bin/busybox --app target/guest-app > target/kvm-boot.log 2>&1
            cat target/kvm-boot.log
            tr -d '\r' < target/kvm-boot.log | grep -x 'SPACETIME_APP_OK'
            echo '::notice::Hardware KVM launch tested on the CI runner (not target performance evidence).'
          else
            echo '::notice::KVM unavailable to CI user; hardware launch not tested.'
          fi
