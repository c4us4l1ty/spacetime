name: Spacetime CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compile and verify Block 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Release build
        run: cargo build --workspace --release

      - name: CLI smoke - happy path
        run: |
          cargo run --release -p spacetime-ctl -- run --task bench/tasks/block1_hello.task --cortex scripted --ledger target/block1.jsonl
          cargo run --release -p spacetime-ctl -- ledger verify target/block1.jsonl
          cargo run --release -p spacetime-ctl -- replay target/block1.jsonl > target/replay.json
          cmp target/block1.jsonl.state target/replay.json

      - name: CLI smoke - false claim
        run: |
          cargo run --release -p spacetime-ctl -- run --task bench/tasks/block1_false_claim.task --cortex scripted --ledger target/false.jsonl
          cargo run --release -p spacetime-ctl -- ledger verify target/false.jsonl
          grep -q '"goal_status":"unverified"' target/false.jsonl.state

      - name: CLI smoke - timeout
        run: |
          cargo run --release -p spacetime-ctl -- run --task bench/tasks/block1_timeout.task --cortex scripted --ledger target/timeout.jsonl
          cargo run --release -p spacetime-ctl -- ledger verify target/timeout.jsonl
          grep -q '"goal_status":"failed"' target/timeout.jsonl.state

      - name: Machine baseline
        run: cargo run --release -p spacetime-ctl -- machine
