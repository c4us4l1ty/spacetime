name: Spacetime CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compile and verify Blocks 1-2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Install Rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        continue-on-error: true
        run: cargo test --workspace --all-targets --locked

      - name: Release build
        continue-on-error: true
        run: cargo build --workspace --release --locked

      - name: CLI smoke - happy path
        continue-on-error: true
        run: |
          cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_hello.task --cortex scripted --ledger target/block1.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/block1.jsonl
          cargo run --release --locked -p spacetime-ctl -- replay target/block1.jsonl > target/replay.json
          cmp target/block1.jsonl.state target/replay.json

      - name: CLI smoke - false claim
        continue-on-error: true
        run: |
          ! cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_false_claim.task --cortex scripted --ledger target/false.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/false.jsonl
          grep -q '"goal_status":"unverified"' target/false.jsonl.state

      - name: CLI smoke - timeout
        continue-on-error: true
        run: |
          ! cargo run --release --locked -p spacetime-ctl -- run --task bench/tasks/block1_timeout.task --cortex scripted --ledger target/timeout.jsonl
          cargo run --release --locked -p spacetime-ctl -- ledger verify target/timeout.jsonl
          grep -q '"goal_status":"failed"' target/timeout.jsonl.state

      - name: Crucible smoke - determinism and metrology
        continue-on-error: true
        run: |
          cargo run --release --locked -p spacetime-ctl -- crucible verify --task bench/tasks/block1_hello.task > target/crucible-verify.txt
          grep -q 'verdict=pass' target/crucible-verify.txt
          cargo run --release --locked -p spacetime-ctl -- crucible false-pass --task bench/tasks/block1_hello.task --runs 50 > target/crucible-false-pass.txt
          grep -q 'false_pass_rate=0.0000' target/crucible-false-pass.txt
          cargo run --release --locked -p spacetime-ctl -- crucible differential --limit 1000000 > target/crucible-differential.txt
          grep -q 'differential_matches=1000000' target/crucible-differential.txt
          grep -q 'mutation_score_bps=10000' target/crucible-differential.txt
          cargo run --release --locked -p spacetime-ctl -- crucible sources > target/crucible-sources.txt
          grep -q 'priority=1 source=FixtureSuite' target/crucible-sources.txt
          grep -q 'priority=5 source=Mutation' target/crucible-sources.txt
          for task in bench/tasks/block2_flaky*.task; do
            ! cargo run --release --locked -p spacetime-ctl -- crucible verify --task "$task"
          done
          cargo run --release --locked -p spacetime-ctl -- crucible panel --task bench/tasks/block1_hello.task > target/crucible-panel.txt
          grep -q 'panel_verdict=pass' target/crucible-panel.txt
          grep -q 'sources=5' target/crucible-panel.txt
          grep -q 'conflicts=0' target/crucible-panel.txt
          cargo run --release --locked -p spacetime-ctl -- crucible adversarial --dir bench/adversarial > target/crucible-adversarial.txt
          grep -q 'adversarial_fixtures=20' target/crucible-adversarial.txt
          grep -q 'mismatches=0' target/crucible-adversarial.txt
          cargo run --release --locked -p spacetime-ctl -- crucible population --operators 10 --runs 50 > target/crucible-population.txt
          grep -q 'runs_per_operator=50' target/crucible-population.txt
          grep -q 'promoted_false_pass_leaks=0' target/crucible-population.txt
          grep -q 'real_operator_study=false' target/crucible-population.txt
          cargo run --release --locked -p spacetime-ctl -- crucible fixture-population --runs 50 > target/crucible-fixture-population.txt
          grep -q 'fixtures=26' target/crucible-fixture-population.txt
          grep -q 'verifier_runs=1300' target/crucible-fixture-population.txt
          grep -q 'max_flip_rate=0.0000' target/crucible-fixture-population.txt
          grep -q 'max_leak_rate=0.0000' target/crucible-fixture-population.txt
          grep -q 'mismatches=0' target/crucible-fixture-population.txt
          grep -q 'real_fixture_population=true' target/crucible-fixture-population.txt
          grep -q 'real_operator_study=false' target/crucible-fixture-population.txt
          ! cargo run --release --locked -p spacetime-ctl -- crucible false-pass --task bench/tasks/block1_hello.task --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible differential --limit 1
          ! cargo run --release --locked -p spacetime-ctl -- crucible population --operators 10 --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible fixture-population --runs 0
          ! cargo run --release --locked -p spacetime-ctl -- crucible adversarial --dir
          ! cargo run --release --locked -p spacetime-ctl -- machine gate --measurement
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --measurement
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --measurement --out target/verify.toml
          ! cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml --unknown value
          ! cargo run --release --locked -p spacetime-ctl -- verify --measurement target/ci-host.measurement

      - name: End-to-end verification
        continue-on-error: true
        run: |
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify.toml > target/verify.stdout
          cat target/verify.toml
          grep -q '^status = "pass"$' target/verify.toml
          grep -q '^failed = 0$' target/verify.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify.toml
          grep -q 'name = "block1_happy"' target/verify.toml
          grep -q 'name = "crucible_flaky_family"' target/verify.toml
          grep -q '^gates = 25$' target/verify.toml
          grep -q 'name = "determinism_controls"' target/verify.toml
          grep -q 'name = "capability_enforcement"' target/verify.toml
          grep -q 'name = "cli_input_validation"' target/verify.toml
          grep -q 'name = "verifier_panel"' target/verify.toml
          grep -q 'name = "adversarial_corpus"' target/verify.toml
          grep -q 'name = "operator_population"' target/verify.toml
          grep -q 'name = "fixture_population"' target/verify.toml
          grep -q 'name = "resource_gate_unmeasured"' target/verify.toml
          grep -q '^panel_sources = 5$' target/verify.toml
          grep -q '^adversarial_fixtures = 20$' target/verify.toml
          grep -q '^determinism_shim = "ld_preload_not_complete_boundary"$' target/verify.toml
          grep -q '^capability_allow_list = "local_fixture_only"$' target/verify.toml
          grep -q '^fixture_population_fixtures = 26$' target/verify.toml
          grep -q '^fixture_population_runs = 50$' target/verify.toml
          grep -q '^fixture_population_verifier_runs = 1300$' target/verify.toml
          grep -q '^synthetic_operator_population = true$' target/verify.toml
          grep -q '^real_operator_study = "unmeasured"$' target/verify.toml
          grep -q '^resource_gate_evaluator = "unmeasured_fail_pass_self_test"$' target/verify.toml
          grep -q '^cli_input_validation = "bounded"$' target/verify.toml
          grep -q '^resource_gate_host_validation = true$' target/verify.toml
          grep -q 'name = "measurement_intake"' target/verify.toml
          grep -q '^measurement_intake = "none"$' target/verify.toml
          grep -q '^measurement_evaluator = "none"$' target/verify.toml
          grep -q '^measurement_digest = "none"$' target/verify.toml
          grep -q 'no measurement file supplied' target/verify.toml

      - name: Measurement intake smoke
        continue-on-error: true
        run: |
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=github_actions\npeak_rss_kb=3000000\nboot_ms=900\ntab_switch_ms=900\ncpu_percent=80\n' > target/ci-host.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-ci-host.toml --measurement target/ci-host.measurement > target/verify-ci-host.stdout
          cat target/verify-ci-host.toml
          grep -q '^status = "pass"$' target/verify-ci-host.toml
          grep -q '^gates = 25$' target/verify-ci-host.toml
          grep -q '^measurement_intake = "evaluated"$' target/verify-ci-host.toml
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-ci-host.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify-ci-host.toml
          grep -q '^performance_claims = "unmeasured"$' target/verify-ci-host.toml
          grep -q 'non-target host' target/verify-ci-host.toml
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=potato-target-lab\npeak_rss_kb=oops\n' > target/invalid.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-invalid.toml --measurement target/invalid.measurement > target/verify-invalid.stdout
          grep -q '^status = "pass"$' target/verify-invalid.toml
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-invalid.toml
          grep -q 'bounded unsigned integer' target/verify-invalid.toml
          head -c 70000 /dev/zero > target/oversize.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-oversize.toml --measurement target/oversize.measurement > target/verify-oversize.stdout
          grep -q '^measurement_evaluator = "unmeasured"$' target/verify-oversize.toml
          grep -q '64 KiB bound' target/verify-oversize.toml
          printf 'schema_version=1\ntarget_profile=4gb_potato\nmeasurement_host=potato-target-lab\npeak_rss_kb=3000000\nboot_ms=900\ntab_switch_ms=900\ncpu_percent=80\n' > target/shape-only.measurement
          cargo run --release --locked -p spacetime-ctl -- verify --out target/verify-shape.toml --measurement target/shape-only.measurement > target/verify-shape.stdout
          grep -q '^measurement_evaluator = "pass_shape_only"$' target/verify-shape.toml
          grep -q '^resource_gate = "unmeasured_target_4gb"$' target/verify-shape.toml
          grep -q '^performance_claims = "unmeasured"$' target/verify-shape.toml
          grep -q 'physical provenance out of band' target/verify-shape.toml

      - name: Machine baseline
        continue-on-error: true
        run: |
          cargo run --release --locked -p spacetime-ctl -- machine
          cargo run --release --locked -p spacetime-ctl -- machine gate > target/machine-gate.txt
          grep -q 'resource_gate=unmeasured' target/machine-gate.txt
          cat target/machine-gate.txt
