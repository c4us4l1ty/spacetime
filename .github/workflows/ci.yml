name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Canonical gate and the *remote compiler* for agents working without a local
  # toolchain. Compiler and clippy diagnostics are re-emitted as GitHub
  # annotations so failures can be read through the checks API (`gh api
  # .../check-runs/<id>/annotations`) without log or artifact downloads.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            full: true
          - os: macos-latest
            full: false
          - os: windows-latest
            full: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.full
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short > clippy.txt 2>&1 && STATUS=0 || STATUS=$?
          tail -40 clippy.txt
          exit $STATUS
      - name: Test
        shell: bash
        if: matrix.full
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast > tests.txt 2>&1 && STATUS=0 || STATUS=$?
          grep -E 'test result' tests.txt | head -20
          tail -60 tests.txt
          exit $STATUS
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            clippy.txt
            tests.txt
          if-no-files-found: ignore

  # Release build plus a live dashboard smoke test: every push proves the demo
  # renders and /api/state is valid JSON with the expected sections.
  smoke:
    name: build + serve smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: |
          set -o pipefail
          cargo build --workspace --release 2>&1 | tee build.txt
      - name: CLI presents itself
        run: |
          set -o pipefail
          ./target/release/spacetime versions 2>&1 | tee -a build.txt
      - name: CLI runs a headless session
        run: |
          set -o pipefail
          ./target/release/spacetime run --ticks 40 2>&1 | tee -a build.txt
      - name: Dashboard serves valid state
        run: |
          set -o pipefail
          {
            ./target/release/spacetime serve --port 7420 &
            SERVER=$!
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:7420/api/state > state.json; then break; fi
              sleep 0.25
            done
            kill $SERVER || true
            test -s state.json || { echo "::error title=smoke::dashboard never answered"; exit 1; }
            python3 - <<'PY'
          import json
          state = json.load(open('state.json'))
          for key in ('tabs', 'travel', 'net', 'warden', 'agent', 'cursor', 'zygote', 'log'):
              assert key in state, f'missing {key}'
          assert state['tabs']['live'] >= 3, state['tabs']
          print('state ok:', state['tabs']['live'], 'tabs,', len(state['net']['entries']), 'net events')
          PY
          } 2>&1 | tee -a build.txt
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-smoke
          path: build.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-state
          path: state.json

  # The guest image must build for the real targets (static musl PID 1).
  guest:
    name: guest-init cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static guest init
        run: |
          cargo build --release -p guest-init --target x86_64-unknown-linux-musl
          cargo build --release -p guest-init --target aarch64-unknown-linux-musl
      - name: Verify it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/guest-init
          file target/aarch64-unknown-linux-musl/release/guest-init

  # Agents cannot always download artifacts or logs. This job turns the failure
  # logs into a commit comment, which is readable through the REST API:
  #   gh api repos/:owner/:repo/commits/<sha>/comments --jq '.[0].body'
  report:
    name: report diagnostics
    runs-on: ubuntu-latest
    needs: [check, smoke, guest]
    if: always() && (needs.check.result == 'failure' || needs.smoke.result == 'failure' || needs.guest.result == 'failure')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          merge-multiple: true
        continue-on-error: true
      - name: Post diagnostics as a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "downloaded files:"; ls -la || true
          body=/tmp/body.md
          {
            echo "### CI diagnostics for ${SHA:0:7}"
            echo
            for f in clippy.txt tests.txt build.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo
              echo '```'
              # Strip ANSI first (cargo emits colour codes even into files),
              # then keep useful lines and cap at 300 lines per file.
              sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' "$f" \
                | grep -E 'error|warning\[|warning:|test result|FAILED|panicked|assertion|left:|right:|^ *-->|^ *\||^ *=' \
                | head -300 || true
              echo '```'
              echo "</details>"
              echo
            done
          } > "$body"
          # GitHub commit comments are capped at 65536 bytes.
          head -c 60000 "$body" > /tmp/body.trim && mv /tmp/body.trim "$body"
          BYTES=$(wc -c < "$body")
          echo "comment body bytes: $BYTES"
          if [ "$BYTES" -lt 400 ]; then
            echo "(no logs captured; still posting a note so the failure is visible)"
            echo "No compiler logs were captured for this run (artifacts missing or empty). See the failing jobs directly." >> "$body"
          fi
          cp "$body" /tmp/summary.md
          jq -n --rawfile b "$body" '{body: $b}' > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/payload.json -o /tmp/resp.json -w "http %{http_code}\n"
          head -c 300 /tmp/resp.json || true
