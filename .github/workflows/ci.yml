name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Canonical gate. `RUSTFLAGS=-D warnings` makes every rustc/clippy warning fatal,
  # so this is also the remote compiler for agents working without a toolchain.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            full: true
          - os: macos-latest
            full: false
          - os: windows-latest
            full: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (authoritative)
        if: matrix.full
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format hint
        if: matrix.full && failure()
        run: echo "::warning::run 'cargo fmt --all' before pushing"

  # Release build plus a live dashboard smoke test: every push proves the demo
  # renders and /api/state is valid JSON with the expected sections.
  smoke:
    name: build + serve smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release
      - name: CLI presents itself
        run: ./target/release/spacetime versions
      - name: CLI runs a headless session
        run: ./target/release/spacetime run --ticks 40
      - name: Dashboard serves valid state
        run: |
          ./target/release/spacetime serve --port 7420 &
          SERVER=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7420/api/state > state.json; then break; fi
            sleep 0.25
          done
          kill $SERVER || true
          test -s state.json
          python3 - <<'PY'
          import json
          state = json.load(open('state.json'))
          for key in ('tabs', 'travel', 'net', 'warden', 'agent', 'cursor', 'zygote', 'log'):
              assert key in state, f'missing {key}'
          assert state['tabs']['live'] >= 3, state['tabs']
          print('state ok:', state['tabs']['live'], 'tabs,', len(state['net']['entries']), 'net events')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-state
          path: state.json

  # The guest image must build for the real targets (static musl PID 1).
  guest:
    name: guest-init cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static guest init
        run: |
          cargo build --release -p guest-init --target x86_64-unknown-linux-musl
          cargo build --release -p guest-init --target aarch64-unknown-linux-musl
      - name: Verify it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/guest-init
          file target/aarch64-unknown-linux-musl/release/guest-init

  # Fast feedback for agents: print every compiler diagnostic to the summary so
  # failures can be read without downloading logs.
  diagnostics:
    name: diagnostics
    runs-on: ubuntu-latest
    if: always()
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Collect diagnostics
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short 2>&1 | tee clippy.txt || true
          cargo test --workspace --no-fail-fast 2>&1 | tee tests.txt || true
          cargo fmt --all --check > fmt.txt 2>&1 || true
          {
            echo '### clippy'
            echo '```'
            grep -E '^(error|warning)' clippy.txt | head -120 || echo 'clean'
            echo '```'
            echo '### tests'
            echo '```'
            grep -E 'test result|FAILED|panicked' tests.txt | head -80 || echo 'none'
            echo '```'
            echo '### fmt'
            echo '```'
            head -60 fmt.txt || echo 'clean'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            clippy.txt
            tests.txt
            fmt.txt
