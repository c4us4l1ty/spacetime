name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Canonical gate and the *remote compiler* for agents working without a local
  # toolchain. Compiler and clippy diagnostics are re-emitted as GitHub
  # annotations so failures can be read through the checks API (`gh api
  # .../check-runs/<id>/annotations`) without log or artifact downloads.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            full: true
          - os: macos-latest
            full: false
          - os: windows-latest
            full: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.full
        run: cargo fmt --all --check
      - name: Clippy + annotations
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short > clippy.txt 2>&1 && STATUS=0 || STATUS=$?
          grep -E '^(error|warning)' clippy.txt | head -150 | while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/''}
            safe=${safe//$'\n'/'%0A'}
            if [[ "$line" == error* ]]; then echo "::error title=clippy::$safe"; else echo "::warning title=clippy::$safe"; fi
          done
          cat clippy.txt | tail -40
          exit $STATUS
      - name: Test + annotations
        shell: bash
        if: matrix.full
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast > tests.txt 2>&1 && STATUS=0 || STATUS=$?
          grep -E '^(error|test .* FAILED|---- .* stdout ----)' tests.txt | head -80 | while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/''}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=test::$safe"
          done
          grep -E 'test result' tests.txt | head -20
          tail -60 tests.txt
          exit $STATUS
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            clippy.txt
            tests.txt
          if-no-files-found: ignore

  # Release build plus a live dashboard smoke test: every push proves the demo
  # renders and /api/state is valid JSON with the expected sections.
  smoke:
    name: build + serve smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release
      - name: CLI presents itself
        run: ./target/release/spacetime versions
      - name: CLI runs a headless session
        run: ./target/release/spacetime run --ticks 40
      - name: Dashboard serves valid state
        run: |
          ./target/release/spacetime serve --port 7420 &
          SERVER=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7420/api/state > state.json; then break; fi
            sleep 0.25
          done
          kill $SERVER || true
          test -s state.json || { echo "::error title=smoke::dashboard never answered"; exit 1; }
          python3 - <<'PY'
          import json
          state = json.load(open('state.json'))
          for key in ('tabs', 'travel', 'net', 'warden', 'agent', 'cursor', 'zygote', 'log'):
              assert key in state, f'missing {key}'
          assert state['tabs']['live'] >= 3, state['tabs']
          print('state ok:', state['tabs']['live'], 'tabs,', len(state['net']['entries']), 'net events')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-state
          path: state.json

  # The guest image must build for the real targets (static musl PID 1).
  guest:
    name: guest-init cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static guest init
        run: |
          cargo build --release -p guest-init --target x86_64-unknown-linux-musl
          cargo build --release -p guest-init --target aarch64-unknown-linux-musl
      - name: Verify it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/guest-init
          file target/aarch64-unknown-linux-musl/release/guest-init
