name: fmt

# Applies rustfmt and commits the result, so a machine with no local Rust
# toolchain can satisfy `cargo fmt --all --check` through CI.
#
# Now that this workflow lives on the default branch (`main`), both
# `gh workflow run fmt.yml` and the `[fmt]` push marker are available:
#   git commit --allow-empty -m "style: apply rustfmt [fmt]" && git push
# The generated `style: cargo fmt` commit carries no marker, so there is no loop.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**', 'main']

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fmt]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all
      - name: Commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then echo "already formatted"; exit 0; fi
          git config user.name "spacetime-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          # Deliberately no [skip ci]: the formatted commit must be checked by
          # the remote compiler (ci.yml + diag.yml) on the very next push.
          git commit -m "style: cargo fmt"
          git push origin "HEAD:refs/heads/$BRANCH"
