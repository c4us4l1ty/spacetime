name: fmt

# Applies rustfmt and commits the result. Run manually when the formatting check
# is the only failure; this keeps machines without a Rust toolchain honest.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "already formatted"; exit 0; fi
          git config user.name "spacetime-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          # Deliberately no [skip ci]: the formatted commit must be checked by
          # the remote compiler (ci.yml + diag.yml) on the very next push.
          git commit -m "style: cargo fmt"
          git push
