name: diag

# The remote compiler for agents working without a local Rust toolchain.
#
# One job runs the whole gate (check / clippy / test / fmt) and posts the
# *complete*, ANSI-stripped logs as a commit comment, readable via:
#   gh api repos/:owner/:repo/commits/<sha>/comments --jq '.[0].body'
# It always posts — including when everything is green — so a single API call
# tells an agent both whether the tree is healthy and exactly what failed.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile, lint, test and check formatting
        run: |
          set +e
          cargo check --workspace --all-targets --message-format=short > check.log 2>&1
          echo $? > check.status
          RUSTFLAGS="-D warnings" cargo clippy --workspace --all-targets --message-format=short > clippy.log 2>&1
          echo $? > clippy.status
          cargo test --workspace --no-fail-fast > test.log 2>&1
          echo $? > test.status
          cargo fmt --all --check > fmt.log 2>&1
          echo $? > fmt.status
          (
            set -e
            rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            cargo build --release -p guest-init --target x86_64-unknown-linux-musl
            cargo build --release -p guest-init --target aarch64-unknown-linux-musl
          ) > guest.log 2>&1
          echo $? > guest.status
          wc -l check.log clippy.log test.log fmt.log guest.log || true
      - name: Post diagnostics as a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # No pipefail here: `head` closing a pipe early is expected and must
          # not abort the comment (SIGPIPE from sed/grep is harmless).
          set -eu
          body=/tmp/body.md
          {
            echo "### remote compiler diagnostics for ${SHA:0:7}"
            echo
            echo "| gate | exit | log lines |"
            echo "| --- | --- | --- |"
            for f in check clippy test fmt guest; do
              printf '| %s | `%s` | %s |\n' "$f" "$(cat "$f.status")" "$(wc -l < "$f.log")"
            done
            echo
            for f in check clippy test fmt guest; do
              status=$(cat "$f.status")
              if [ "$status" = "0" ]; then continue; fi
              echo "<details><summary>$f.log (exit $status)</summary>"
              echo
              echo '```'
              sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' "$f.log" | head -400 || true
              echo '```'
              echo "</details>"
              echo
            done
            echo "_Generated by .github/workflows/diag.yml_"
          } > "$body"
          # GitHub commit comments are capped at 65536 bytes.
          head -c 60000 "$body" > /tmp/body.trim && mv /tmp/body.trim "$body"
          echo "comment body bytes: $(wc -c < "$body")"
          jq -n --rawfile b "$body" '{body: $b}' > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/payload.json -o /tmp/resp.json -w "http %{http_code}\n"
          head -c 200 /tmp/resp.json || true
